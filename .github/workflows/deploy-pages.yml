name: "deploy to pages"

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - "README.md"
  workflow_dispatch: {}

jobs:
  deploy:
    # pinned so the ubuntu-latest -> 26.04 migration (2026-10-19) doesn't change the build env silently
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0  # keep in sync with mise.toml
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          # the PDF is built locally and committed, so CI has no use for Chromium
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: pnpm run build

      # pdf
      # - run: pnpm run build-pdf

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the action's own default is "latest", which would jump to the next major on release
          wranglerVersion: "4"
          # the action installs wrangler via `pnpm add`, which dirties package.json and the lockfile
          command: pages deploy dist --project-name=cv --branch=master --commit-dirty=true
